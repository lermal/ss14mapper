# Include in the SS14 Mapper server context. Set root to dist/ and load mime.types.
location = / {
    add_header X-Robots-Tag $ss14mapper_robots;
    add_header Cache-Control $ss14mapper_html_cache;
    try_files /index.html =404;
}

location = /index.html {
    return 301 /$is_args$args;
}

location = /guide {
    return 301 /guide/$is_args$args;
}

location = /guide/index.html {
    return 301 /guide/$is_args$args;
}

location = /guide/ {
    add_header Cache-Control "no-cache";
    try_files /guide/index.html =404;
}

location / {
    try_files $uri =404;
}
