# Include in the nginx http context.
# URLSearchParams matches decoded parameter names and treats key-only parameters as empty values.
map $args $ss14mapper_robots {
    default "";
    "~(^|&)((o|%6[fF])(p|%70)(e|%65)(n|%6[eE])|(m|%6[dD])(a|%61)(p|%70)|(s|%73)(i|%69)(g|%67)(n|%6[eE])(i|%69)(n|%6[eE]))(=|&|$)" "noindex";
}

map $ss14mapper_robots $ss14mapper_html_cache {
    default "no-cache";
    noindex "private, no-store";
}
