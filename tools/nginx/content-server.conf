# CMS variant: use INSTEAD OF public-discovery-server.conf.
# Keep public-discovery-http.conf in http{}, set root to the frontend dist/.
# Include content-upstream-http.conf (adapt its backend address) in http{}.
location = / {
    add_header X-Robots-Tag $ss14mapper_robots;
    add_header Cache-Control $ss14mapper_html_cache;
    try_files /index.html =404;
}

location = /index.html {
    return 301 /$is_args$args;
}

location = /ru {
    return 301 /ru/$is_args$args;
}

location = /ru/index.html {
    return 301 /ru/$is_args$args;
}

location = /ru/ {
    add_header X-Robots-Tag $ss14mapper_robots;
    add_header Cache-Control $ss14mapper_html_cache;
    try_files /ru/index.html =404;
}

# The management screen is static; /admin/content API stays on the API host.
location = /admin/content { return 301 /admin/content/$is_args$args; }
location = /admin/content/index.html { return 301 /admin/content/$is_args$args; }
location = /admin/content/ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "private, no-store" always;
    try_files /admin/content/index.html =404;
}

# HTML, media and sitemap come from Laravel, including unknown article 404s.
location ~ ^/(guide|faq|content-media)(/|$) {
    proxy_pass http://ss14mapper_content;
    proxy_set_header Host $ss14mapper_content_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_hide_header Set-Cookie;
    proxy_cache off;
    proxy_intercept_errors off;
}

location = /sitemap.xml {
    proxy_pass http://ss14mapper_content;
    proxy_set_header Host $ss14mapper_content_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_hide_header Set-Cookie;
    proxy_cache off;
    proxy_intercept_errors off;
}

location / { try_files $uri =404; }
