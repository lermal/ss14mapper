<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SS14 Mapper — Space Station 14 Map Editor</title>
    <meta name="description" content="Open, create and edit Space Station 14 YAML maps in your browser. Choose a build, work on a shuttle or station, and download your map for the game.">
    <link rel="canonical" href="https://ss14mapper.forged.by/">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="SS14 Mapper">
    <meta property="og:title" content="SS14 Mapper — Space Station 14 Map Editor">
    <meta property="og:description" content="Open, create and edit Space Station 14 YAML maps in your browser.">
    <meta property="og:url" content="https://ss14mapper.forged.by/">
    <meta property="og:image" content="https://ss14mapper.forged.by/social-card.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="SS14 Mapper — Space Station 14 map editor.">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="/src/ui/theme.css">
    <link rel="stylesheet" href="/src/ui/start-screen.css">
    <noscript><style>#start-status { display: none; }</style></noscript>
</head>
<body>
    <div id="start" class="start">
        <header class="st-top">SS14 Mapper</header>
        <main>
            <div class="st-cols">
                <div class="st-main">
                    <section class="st-intro" lang="en" aria-labelledby="start-title">
                        <h1 id="start-title">Space Station 14 map editor</h1>
                        <p class="st-lead">Open, create and edit Space Station 14 YAML maps in your browser. Choose a build, work on a shuttle or station, and download your map for the game.</p>
                        <a href="/guide/">Read the mapping guide <span aria-hidden="true">→</span></a>
                    </section>
                    <p id="start-status" class="st-note" role="status" lang="en">Loading editor and builds…</p>
                    <noscript><p>The editor needs JavaScript.</p></noscript>
                </div>
                <aside class="st-library"></aside>
            </div>
        </main>
    </div>
    <div id="app" class="app" hidden>
        <header id="topbar"></header>
        <div id="optionsbar"></div>
        <div class="workspace">
            <nav id="rail" aria-label="Tools"></nav>
            <aside id="palette" class="palette-col" aria-label="Palette"></aside>
            <main id="view" class="view" aria-label="Map">
                <canvas id="parallax"></canvas>
                <canvas id="map"></canvas>
                <canvas id="overlay"></canvas>
                <div id="map-controls"></div>
            </main>
            <aside id="properties" class="properties" aria-label="Properties" hidden>
                <div id="link-panel"></div>
                <div id="inspector"></div>
            </aside>
        </div>
        <footer id="statusbar"></footer>
    </div>
    <input type="file" id="file" accept=".yml,.yaml" hidden>
    <script type="module" src="/src/bootstrap.ts"></script>
</body>
</html>
